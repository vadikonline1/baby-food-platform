name: build-apk

# Build Android APK pe runner GitHub (GRATUIT, fara credite EAS):
# expo prebuild + Gradle assembleRelease, la fiecare push pe `main`
# care atinge aplicatia mobila. Tag-ul release-ului: apk-main-<sha> —
# aplicatia foloseste acest prefix ca feed pentru actualizarile in-app.
# (workflow unic pentru APK — cel nativ a fost scos)
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'google-services.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Get app version
        id: version
        run: echo "app_version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Copy google-services.json (FCM push)
        run: cp ../google-services.json ./google-services.json

      - name: Embed build SHA (in-app update feed)
        run: |
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.extra.build_sha='${{ github.sha }}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
          echo "embedded build_sha=${{ github.sha }}"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate native android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Pin Kotlin Gradle Plugin to 2.3.0
        # play-services-ads >= 25.3 (folosit de react-native-google-mobile-ads 16.5)
        # e compilat cu Kotlin 2.3.0 -> compilatorul trebuie sa fie >= 2.3.0.
        # expo-build-properties scrie android.kotlinVersion doar in gradle.properties
        # (afecteaza doar catalogul expoLibs), dar modulul react-native-google-mobile-ads
        # compileaza cu KGP-ul de pe buildscript-ul root, care ramane 2.1.x (default RN).
        # Fix: pinam explicit versiunea KGP in android/build.gradle generat de prebuild.
        run: |
          sed -i.bak "s/classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')/classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0')/" android/build.gradle
          if ! grep -q "kotlin-gradle-plugin:2.3.0" android/build.gradle; then
            echo "::error::Nu am gasit linia kotlin-gradle-plugin in android/build.gradle"
            exit 1
          fi
          grep -n "kotlin-gradle-plugin" android/build.gradle
          rm -f android/build.gradle.bak

      - name: Configure Gradle heap + local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          # printf cu \n initial: expo-build-properties scrie kotlinVersion
          # fara newline la final, iar echo >> ar lipi pe aceeasi linie
          # (asa a ajuns "2.3.0org.gradle.jvmargs=..." -> rezolvare esuata)
          if [ -f android/gradle.properties ]; then
            printf '\norg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m\norg.gradle.daemon=false\n' >> android/gradle.properties
          fi

      - name: Build release APK
        # Nota: -Pexpo.inlineModules.watchedDirectories='[]' ocoleste un bug
        # expo-modules-autolinking@57 (lista goala e ignorata de Gradle ->
        # commander primeste flag fara valoare si iese cu 1). Fara module
        # inline locale, valoarea "[]" e corecta.
        run: |
          node --version
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -Pexpo.inlineModules.watchedDirectories='[]'
          cd ..

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v5
        with:
          name: gustbebe-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: apk-${{ github.ref_name }}-${{ github.sha }}
          name: APK ${{ github.ref_name }} (${{ github.sha }})
          body: |
            Build automat APK Android (debug-signed, instalabil direct).

            **Versiune aplicație:** ${{ steps.version.outputs.app_version }}
            **APK-uri per-arhitectură:** alege `app-arm64-v8a-release.apk` (telefoane moderne) sau `app-armeabi-v7a-release.apk` (vechi, 32-bit).
            **Actualizări in-app:** aplicația verifică singură tag-urile `apk-main-*`.
          files: mobile/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
