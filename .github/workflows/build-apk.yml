name: build-apk

# Build Android APK (Expo EAS, profil preview) — la push in mobile/** sau manual.
# Necesita secretul EXPO_TOKEN (Expo dashboard -> Access Tokens -> repo Settings -> Secrets -> Actions).
# google-services.json se ia din EAS credentials (eas credentials) sau din mobile/ la build.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS"
        type: choice
        options: [preview, production]
        default: preview
  push:
    branches: [main]
    paths: ["mobile/**"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
      - run: npx tsc --noEmit

      - name: EAS build Android APK
        run: eas build --platform android --profile ${{ inputs.profile || 'preview' }} --non-interactive
