name: build-native-apk

# Aplicatia NATIVA Android (Jetpack Compose, Material 3 Expressive) din native/.
# Build local pe runner GitHub (GRATUIT, fara credite EAS) + Release APK.
on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

jobs:
  native-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: native

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Get app version
        id: version
        run: echo "app_version=$(grep -m1 versionName app/build.gradle.kts | sed 's/[^0-9.]//g')" >> "$GITHUB_OUTPUT"

      - name: Build release APK (signed debug key)
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v5
        with:
          name: gustbebe-native-apk
          path: native/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: native-apk-${{ github.ref_name }}-${{ github.sha }}
          name: Native APK ${{ github.ref_name }} (${{ github.sha }})
          body: |
            Aplicatia NATIVA Android (Jetpack Compose, Material 3 Expressive) — APK release semnat cu cheie debug, instalabil direct.

            **Versiune aplicație:** ${{ steps.version.outputs.app_version }}
            **API URL:** https://gustbebe.aalto.md/api
          files: native/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
