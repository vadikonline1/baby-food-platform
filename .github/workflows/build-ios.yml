name: build-ios

# Build iOS pe runner GitHub (GRATUIT, fara credite EAS):
# expo prebuild + xcodebuild pentru Simulator (nesemnat).
# Pentru dispozitiv fizic e nevoie de certificat Apple (vezi EAS Submit).
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'GoogleService-Info.plist'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Get app version
        id: version
        run: echo "app_version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Generate native ios project (expo prebuild)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document || true
          cd ios
          if [ -f Podfile ]; then pod install; fi
          cd ..

      - name: Build iOS app (simulator, unsigned)
        run: |
          cd ios
          WS=$(find . -maxdepth 1 -type d -name '*.xcworkspace' | head -1)
          if [ -z "$WS" ]; then
            WS=$(ls -1d *.xcworkspace 2>/dev/null | head -1)
          fi
          echo "workspace=${WS:-<none>}"
          # Schema = numele workspace-ului (ex: GustBebe), nu primul utilitar (ex: EASClient).
          APP_NAME=$(basename "$WS" .xcworkspace)
          LIST=$(xcodebuild -list -workspace "$WS" 2>/dev/null | sed -n '/Schemes:/,$p' | tail -n +2)
          if echo "$LIST" | grep -q "^[[:space:]]*${APP_NAME}[[:space:]]*$"; then
            SCHEME="$APP_NAME"
          else
            SCHEME=$(echo "$LIST" | grep -v '^\s*$' | grep -iv 'pod' | grep -iv 'EASClient' | head -1 | xargs)
          fi
          echo "scheme=${SCHEME:-<none>}"
          if [ -z "$SCHEME" ]; then echo "::error::Could not detect an Xcode scheme under ios/"; exit 1; fi
          xcodebuild -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          cd ..

      - name: Upload iOS app (workflow artifact)
        uses: actions/upload-artifact@v5
        with:
          name: gustbebe-ios-simulator
          path: mobile/ios/build/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: warn

      - name: Zip iOS app for Release asset
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          APP=$(find . -maxdepth 1 -name '*.app' | head -1)
          echo "app=${APP:-<none>}"
          if [ -z "$APP" ]; then echo "::error::No .app found for zip"; exit 1; fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/mobile/gustbebe-ios-simulator.zip"
          ls -la "$GITHUB_WORKSPACE/mobile/gustbebe-ios-simulator.zip"

      - name: Publish iOS info to GitHub Release
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: apk-${{ github.ref_name }}-${{ github.sha }}
          name: Release ${{ github.ref_name }} (${{ github.sha }})
          body: |
            Release unic pe commit: Android + iOS + Docker.

            **Android (telefoane):** `app-arm64-v8a-release.apk` (modern) sau `app-armeabi-v7a-release.apk` (vechi, 32-bit).
            **iOS:** `gustbebe-ios-simulator.zip` — doar pentru Simulator (nesemnat); pe iPhone fizic e nevoie de certificat Apple (EAS Submit).
            **Docker (server):** `ghcr.io/vadikonline1/baby-food-platform` (tag-urile `:latest` și `:sha-${{ github.sha }}`) — pe server: `docker compose pull && docker compose up -d`.

            **Versiune aplicație:** ${{ steps.version.outputs.app_version }}
            **Actualizări in-app:** aplicația verifică singură tag-urile `apk-main-*`.
          files: mobile/gustbebe-ios-simulator.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
